name: Run Procurement Scraper

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      # Selenium 4.10+ automatically handles downloading the correct ChromeDriver, 
      # and ubuntu-latest already has Chrome installed.
      - name: Run Scraper
        run: python procurement_scrap_v3.py

      - name: Upload Downloaded Data
        uses: actions/upload-artifact@v4
        with:
          name: procurement-data
          path: procurement_data/
          retention-days: 7 # How long GitHub will store the zip file