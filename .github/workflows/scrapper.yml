name: Run Procurement Scraper
on:
  workflow_dispatch:

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: nanasess/setup-chromedriver@v2
      
      - name: Install dependencies
        run: pip install selenium pandas openpyxl
        
      - name: Run Scraper
        run: python procurement_scrap_v3.py
        
      - name: Convert to CSV
        run: |
          python -c "
          import os, pandas as pd
          for f in os.listdir('procurement_data'):
              if f.endswith(('.xlsx', '.xls')):
                  df = pd.read_excel(os.path.join('procurement_data', f))
                  df.to_csv(os.path.join('procurement_data', f.rsplit('.', 1)[0] + '.csv'), index=False)
                  os.remove(os.path.join('procurement_data', f))
          "
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: procurement-data
          path: procurement_data/